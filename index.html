<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f7; --surface:#ffffff; --ink:#18212f; --muted:#6b7689; --line:#e3e8f0;
  --accent:#3d4fe0; --accent-soft:#e8ebfd; --ok:#16a37f;
  --high:#e5484d; --med:#f0a020; --low:#16a37f;
  --shadow:0 1px 2px rgba(24,33,47,.05),0 12px 32px -12px rgba(24,33,47,.14);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f141d; --surface:#171e2b; --ink:#eaeef6; --muted:#8c97ab; --line:#263043;
    --accent:#7b8bff; --accent-soft:#222a4a; --shadow:0 12px 32px -12px rgba(0,0,0,.5); color-scheme:dark;}
}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;display:flex;justify-content:center;padding:48px 16px;line-height:1.5}
.app{width:100%;max-width:640px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.date{color:var(--muted);font-size:.9rem;margin-top:4px}
.ring{position:relative;width:64px;height:64px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .track{stroke:var(--line)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.85rem;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.add{display:flex;flex-wrap:wrap;gap:10px;padding:14px;margin-bottom:16px}
.add input[type=text]{flex:1 1 220px}
input,select,button{font:inherit;color:inherit}
input[type=text],input[type=date],select{background:var(--bg);border:1px solid transparent;border-radius:12px;padding:11px 14px;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 20px;font-weight:700;cursor:pointer;transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{border:0;background:none;border-radius:9px;padding:7px 14px;font-weight:600;font-size:.88rem;color:var(--muted);cursor:pointer}
.tab[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.link{background:none;border:0;color:var(--muted);font-size:.88rem;font-weight:600;cursor:pointer;padding:6px}
.link:hover{color:var(--high)}
ul{list-style:none;padding:0;overflow:hidden}
li{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
.chk{appearance:none;width:24px;height:24px;border:2px solid var(--line);border-radius:50%;cursor:pointer;flex:none;display:grid;place-items:center;transition:all .2s;background:var(--surface)}
.chk:hover{border-color:var(--accent)}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.body{flex:1;min-width:0}
.title{font-weight:600;word-break:break-word;cursor:text}
li.done .title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;gap:10px;align-items:center;font-size:.78rem;color:var(--muted);margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
.over{color:var(--high);font-weight:600}
.edit{width:100%;font-weight:600}
.del{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:1.2rem;line-height:1;flex:none}
.del:hover{background:#e5484d1a;color:var(--high)}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
footer{margin-top:14px;text-align:center;color:var(--muted);font-size:.82rem}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
li.new{animation:in .25s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){body{padding:28px 12px}h1{font-size:1.6rem}.add select,.add input[type=date]{flex:1}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div>
      <h1>My tasks</h1>
      <p class="date" id="today"></p>
    </div>
    <div class="ring" aria-label="Progress">
      <svg width="64" height="64" viewBox="0 0 64 64"><circle class="track" cx="32" cy="32" r="27"/><circle class="bar" id="bar" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"/></svg>
      <b id="pct">0%</b>
    </div>
  </header>

  <form class="card add" id="form" autocomplete="off">
    <input type="text" id="text" placeholder="Add a new task" aria-label="Task title" maxlength="140" required>
    <select id="prio" aria-label="Priority">
      <option value="low">Low</option><option value="med" selected>Medium</option><option value="high">High</option>
    </select>
    <input type="date" id="due" aria-label="Due date">
    <button class="btn" type="submit">Add task</button>
  </form>

  <div class="bar-row">
    <div class="tabs" role="group" aria-label="Filter tasks">
      <button class="tab" data-f="all" aria-pressed="true">All</button>
      <button class="tab" data-f="active" aria-pressed="false">Active</button>
      <button class="tab" data-f="done" aria-pressed="false">Completed</button>
    </div>
    <button class="link" id="clear">Clear completed</button>
  </div>

  <ul class="card" id="list"></ul>
  <footer id="count"></footer>
</main>

<script>
(function(){
  var KEY='todo.tasks.v1', tasks=[], filter='all';
  var $=function(s){return document.querySelector(s)};
  var list=$('#list'), form=$('#form'), text=$('#text'), prio=$('#prio'), due=$('#due');

  function load(){ try{ tasks=JSON.parse(localStorage.getItem(KEY))||[]; }catch(e){ tasks=[]; } }
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(tasks)); }catch(e){} }
  function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmt(s){ var p=s.split('-'); return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{day:'numeric',month:'short'}); }
  var PL={high:'High',med:'Medium',low:'Low'};

  function render(newId){
    var shown=tasks.filter(function(t){ return filter==='all'||(filter==='done'?t.done:!t.done); });
    if(!shown.length){
      var msg=!tasks.length?['No tasks yet','Type a task above and press Add task.']:
        filter==='done'?['Nothing completed yet','Finished tasks will show up here.']:['All caught up','No active tasks left.'];
      list.innerHTML='<li class="empty" style="display:block"><strong>'+msg[0]+'</strong>'+msg[1]+'</li>';
    } else {
      list.innerHTML=shown.map(function(t){
        var over=t.due&&!t.done&&t.due<todayStr();
        return '<li data-id="'+t.id+'" class="'+(t.done?'done ':'')+(t.id===newId?'new':'')+'">'+
          '<input class="chk" type="checkbox" '+(t.done?'checked':'')+' aria-label="Mark complete">'+
          '<div class="body"><div class="title" title="Double-click to edit">'+esc(t.text)+'</div>'+
          '<div class="meta"><span><i class="dot" style="background:var(--'+t.prio+')"></i>'+PL[t.prio]+'</span>'+
          (t.due?'<span class="'+(over?'over':'')+'">'+(over?'Overdue · ':'Due ')+fmt(t.due)+'</span>':'')+'</div></div>'+
          '<button class="del" aria-label="Delete task">×</button></li>';
      }).join('');
    }
    var total=tasks.length, done=tasks.filter(function(t){return t.done}).length;
    var pct=total?Math.round(done/total*100):0;
    $('#pct').textContent=pct+'%';
    $('#bar').style.strokeDashoffset=169.6*(1-pct/100);
    $('#count').textContent=total?(total-done)+' of '+total+' tasks left':'';
    $('#clear').style.visibility=done?'visible':'hidden';
  }

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var v=text.value.trim(); if(!v) return;
    var t={id:Date.now(),text:v,prio:prio.value,due:due.value,done:false};
    tasks.unshift(t); save(); render(t.id);
    text.value=''; due.value=''; text.focus();
  });

  list.addEventListener('click',function(e){
    var li=e.target.closest('li[data-id]'); if(!li) return;
    var id=+li.dataset.id;
    if(e.target.classList.contains('del')){ tasks=tasks.filter(function(t){return t.id!==id}); save(); render(); }
    else if(e.target.classList.contains('chk')){ tasks.forEach(function(t){ if(t.id===id) t.done=e.target.checked; }); save(); render(); }
  });

  list.addEventListener('dblclick',function(e){
    if(!e.target.classList.contains('title')) return;
    var li=e.target.closest('li'), id=+li.dataset.id, t=tasks.find(function(x){return x.id===id});
    var inp=document.createElement('input'); inp.type='text'; inp.className='edit'; inp.value=t.text; inp.maxLength=140;
    e.target.replaceWith(inp); inp.focus(); inp.select();
    var finish=function(ok){ if(ok&&inp.value.trim()) t.text=inp.value.trim(); save(); render(); };
    inp.addEventListener('keydown',function(k){ if(k.key==='Enter') finish(true); if(k.key==='Escape') finish(false); });
    inp.addEventListener('blur',function(){ finish(true); });
  });

  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click',function(){
      filter=b.dataset.f;
      document.querySelectorAll('.tab').forEach(function(x){ x.setAttribute('aria-pressed',x===b); });
      render();
    });
  });

  $('#clear').addEventListener('click',function(){ tasks=tasks.filter(function(t){return !t.done}); save(); render(); });

  $('#today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
  load(); render();
})();
</script>
</body>
</html>
